<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photo Filter App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(120deg, #6a11cb, #2575fc);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff;
      color: #333;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0px 8px 20px rgba(0,0,0,0.2);
      text-align: center;
      width: 400px;
    }
    h2 {
      margin-bottom: 20px;
      color: #2575fc;
    }
    input[type="file"] {
      margin: 10px 0;
    }
    select, button {
      margin-top: 15px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    select {
      background: #f0f0f0;
    }
    button {
      background: #2575fc;
      color: white;
      transition: background 0.3s;
    }
    button:hover {
      background: #1a5ed7;
    }
    img {
      margin-top: 20px;
      max-width: 100%;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>📸 Photo Filter App</h2>
    <input type="file" id="upload" accept="image/*"><br>
    
    <select id="filter">
      <option value="none">No Filter</option>
      <option value="grayscale(100%)">Grayscale</option>
      <option value="sepia(100%)">Sepia</option>
      <option value="invert(100%)">Invert</option>
      <option value="blur(3px)">Blur</option>
      <option value="contrast(200%)">High Contrast</option>
      <option value="brightness(150%)">Brighten</option>
    </select><br>
    
    <button id="download">Download Filtered Photo</button>
    
    <img id="preview" src="">
  </div>

  <script>
    const upload = document.getElementById("upload");
    const preview = document.getElementById("preview");
    const filter = document.getElementById("filter");
    const downloadBtn = document.getElementById("download");

    // Show uploaded image
    upload.addEventListener("change", function(){
      const file = this.files[0];
      if(file){
        const reader = new FileReader();
        reader.onload = function(e){
          preview.src = e.target.result;
          preview.style.filter = "none"; // reset filter
        }
        reader.readAsDataURL(file);
      }
    });

    // Apply filter
    filter.addEventListener("change", function(){
      preview.style.filter = this.value;
    });

    // Download filtered photo
    downloadBtn.addEventListener("click", function(){
      if(!preview.src) return;

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      const img = new Image();
      img.src = preview.src;

      img.onload = function(){
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.filter = filter.value;
        ctx.drawImage(img, 0, 0, img.width, img.height);

        const link = document.createElement("a");
        link.download = "filtered-photo.png";
        link.href = canvas.toDataURL();
        link.click();
      }
    });
  </script>
</body>
</html>
